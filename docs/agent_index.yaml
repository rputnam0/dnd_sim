policies:
  runtime_affecting_prs:
    applies_to_tracks:
      - ARC
      - CAP
      - OBS
      - DBS
      - AI
      - FIX
      - WLD
      - FIN
    requirements:
      - "Runtime-affecting PRs must update docs/agent_index.yaml in the same branch."
      - "New, renamed, or transferred runtime boundaries must include owner_pool, owner_module, invariants, and safe_edit_boundaries."
      - "Review is blocked when backlog target runtime modules are missing ownership coverage in this file."
  maintenance_gate:
    ownership_globs:
      - src/dnd_sim/*.py
    default_max_file_lines: 1500
    file_size_waivers:
      - module: src/dnd_sim/engine_runtime.py
        max_lines: 16450
        reason: "Wave 8 stabilization still keeps combat timing orchestration centralized in engine_runtime.py; immutable hook provenance and roll construction live in focused modules, while the remaining subscription adapters depend on engine-private reaction/resource rules and continue under W8-ARC-01."
      - module: src/dnd_sim/rules_2014.py
        max_lines: 1510
        reason: "The core event contracts carry three provenance-list fields while immutable hook validation is extracted to roll_hook_provenance.py; further unrelated rules decomposition remains outside VTT-ROLL-01."
