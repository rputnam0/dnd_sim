    <radialGradient id="shade"><stop offset=".4" stop-color="#12272d" stop-opacity="0"/><stop offset="1" stop-color="#0c242c" stop-opacity=".55"/></radialGradient>
    <pattern id="stone" width="240" height="144" patternUnits="userSpaceOnUse"><path d="M0 0H240M0 72H240M120 0V72M44 72V144M202 72V144" fill="none" stroke="#182f36" stroke-opacity=".19" stroke-width="3"/><path d="M3 4H117M124 4H236M49 77H197" stroke="#b7b8a3" stroke-opacity=".1" stroke-width="2"/></pattern>
    <pattern id="fleck" width="91" height="67" patternUnits="userSpaceOnUse"><path d="m17 22 12-2m36 27 8 1m-52 14 4 1" stroke="#bcc3b0" stroke-opacity=".12" stroke-linecap="round"/><circle cx="81" cy="13" r="1.5" fill="#213d42" opacity=".2"/></pattern>
