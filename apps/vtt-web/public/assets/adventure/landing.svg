<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Lantern landing</title>
  <desc id="desc">Top-down salt-worn lighthouse landing, with pale stone paving, shallow tidal washes, mooring ropes, and warm pools of lantern light. The center is open for play.</desc>
  <defs>
    <linearGradient id="floor" x2="1" y2="1"><stop stop-color="#425658"/><stop offset=".52" stop-color="#667573"/><stop offset="1" stop-color="#364f54"/></linearGradient>
