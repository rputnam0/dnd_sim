    <radialGradient id="shade"><stop offset=".4" stop-color="#24423f" stop-opacity="0"/><stop offset="1" stop-color="#16383d" stop-opacity=".45"/></radialGradient>
    <linearGradient id="dawn" x1="1" x2="0" y2="1"><stop stop-color="#efd69c" stop-opacity=".25"/><stop offset="1" stop-color="#efd69c" stop-opacity="0"/></linearGradient>
