<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Sheltered stair</title>
  <desc id="desc">Top-down sheltered lighthouse landing in warm gray stone. Shallow stair treads at the far edge lead onward, while a small kettle, folded bedrolls, and amber light suggest a place to rest. The main floor is unobstructed.</desc>
