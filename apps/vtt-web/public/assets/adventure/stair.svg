    <radialGradient id="glow"><stop stop-color="#e9b970" stop-opacity=".52"/><stop offset=".5" stop-color="#d6aa66" stop-opacity=".17"/><stop offset="1" stop-color="#c49855" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade"><stop offset=".36" stop-color="#263d3a" stop-opacity="0"/><stop offset="1" stop-color="#112d31" stop-opacity=".63"/></radialGradient>
  </defs>
