name: capability-catalog-integrity

on:
  pull_request:
    paths:
      - "db/rules/2014/**"
      - "src/dnd_sim/capability_manifest.py"
      - "src/dnd_sim/mechanics_schema.py"
      - "src/dnd_sim/io_models.py"
      - "artifacts/capabilities/**"
      - "scripts/content/**"
      - "tests/*capability*.py"
      - "docs/program/capability_report.md"
      - ".github/workflows/completion-capability-gate.yml"
  push:
    branches:
      - "main"
    paths:
      - "db/rules/2014/**"
      - "src/dnd_sim/capability_manifest.py"
      - "src/dnd_sim/mechanics_schema.py"
      - "src/dnd_sim/io_models.py"
      - "artifacts/capabilities/**"
      - "scripts/content/**"
      - "tests/*capability*.py"
      - "docs/program/capability_report.md"
      - ".github/workflows/completion-capability-gate.yml"

jobs:
  verify-capability-catalog-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run structural capability catalog gate
        run: uv run python scripts/content/verify_completion_capabilities.py

      - name: Run capability catalog tests
        run: uv run python -m pytest tests/test_completion_capabilities.py
